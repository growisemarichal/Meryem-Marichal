<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const wrap = document.getElementById('fanCanvasWrap');
const canvas = document.getElementById('fanCanvas');

if (wrap && canvas) {
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(50, wrap.clientWidth / wrap.clientHeight, 0.1, 100);
  camera.position.set(0, 0, 7);

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(wrap.clientWidth, wrap.clientHeight);

  scene.add(new THREE.AmbientLight(0xffffff, 0.9));
  const key = new THREE.DirectionalLight(0xffffff, 0.6);
  key.position.set(2, 3, 5);
  scene.add(key);

  const group = new THREE.Group();
  scene.add(group);

  const imgCount = 9;
  const cardW = 1.7, cardH = cardW * (1272 / 900);
  const radius = 4.2;
  const angleStep = 0.24;   // separación entre tarjetas — súbelo si las quieres más separadas
  const curve = 0.55;       // profundidad de la curva — súbelo si las quieres más dobladas

  function roundedTexture(url, radiusPx = 40) {
    return new Promise(resolve => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => {
        const c = document.createElement('canvas');
        c.width = img.width; c.height = img.height;
        const ctx = c.getContext('2d');
        ctx.beginPath();
        ctx.moveTo(radiusPx, 0);
        ctx.arcTo(c.width, 0, c.width, c.height, radiusPx);
        ctx.arcTo(c.width, c.height, 0, c.height, radiusPx);
        ctx.arcTo(0, c.height, 0, 0, radiusPx);
        ctx.arcTo(0, 0, c.width, 0, radiusPx);
        ctx.closePath();
        ctx.clip();
        ctx.drawImage(img, 0, 0);
        const tex = new THREE.CanvasTexture(c);
        tex.colorSpace = THREE.SRGBColorSpace;
        resolve(tex);
      };
      img.src = url;
    });
  }

  function makeBentGeometry(w, h) {
    const geo = new THREE.PlaneGeometry(w, h, 30, 1);
    const pos = geo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i);
      const t = x / (w / 2);
      pos.setZ(i, -Math.pow(t, 2) * curve);
    }
    geo.computeVertexNormals();
    return geo;
  }

  (async () => {
    for (let i = 0; i < imgCount; i++) {
      const num = String(i + 1).padStart(2, '0');
      const tex = await roundedTexture(`anexo-${num}.jpg`);

      const mesh = new THREE.Mesh(
        makeBentGeometry(cardW, cardH),
        new THREE.MeshStandardMaterial({ map: tex, side: THREE.DoubleSide, roughness: 0.9, metalness: 0 })
      );

      const angle = (i - (imgCount - 1) / 2) * angleStep;
      mesh.position.x = Math.sin(angle) * radius;
      mesh.position.z = Math.cos(angle) * radius - radius;
      mesh.rotation.y = -angle;

      group.add(mesh);
    }
  })();

  let targetRotY = 0, currentRotY = 0, isDragging = false, startX = 0, startRot = 0;

  wrap.addEventListener('pointerdown', (e) => {
    isDragging = true; startX = e.clientX; startRot = targetRotY;
    wrap.setPointerCapture(e.pointerId);
  });
  wrap.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    targetRotY = startRot + (e.clientX - startX) * 0.006;
  });
  wrap.addEventListener('pointerup', () => { isDragging = false; });
  wrap.addEventListener('pointerleave', () => { isDragging = false; });

  function animate() {
    requestAnimationFrame(animate);
    currentRotY += (targetRotY - currentRotY) * 0.08;
    group.rotation.y = currentRotY;
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = wrap.clientWidth / wrap.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(wrap.clientWidth, wrap.clientHeight);
  });
}
</script>

</body>
